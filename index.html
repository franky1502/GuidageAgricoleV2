<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guidage Agricole V2 — GPS réel</title>
<link rel="apple-touch-icon" href="icon.png">

<link rel="stylesheet" href="style.css">
</head>

<body>



<div class="container">

<h1>GUIDAGE AGRICOLE</h1>

<div class="modeReference">

    <span class="titreModeRef">
    A-B:
    </span>
    
    <label>
        <input
            type="radio"
            name="modeRef"
            value="bord"
            checked>
        Bord parcelle
    </label>

    <label>
        <input
            type="radio"
            name="modeRef"
            value="centre">
        Référence centrale
    </label>

</div>

<div class="reference">

    <button id="btnStartRef">
        <span class="lettreAB">A</span><br>
        Début réf.
    </button>

    <button id="btnStopRef">
        <span class="lettreAB">B</span><br>
        Fin réf.
    </button>

</div>

<div id="etatReference">
    Référence non définie
</div>

<div id="etatGuidage"></div>

<div class="parametres">

    <div>
        <label>1ère passe</label>
        <input id="inputPremierePasse" type="number" min="0" step="0.5" value="14">
    </div>

    <div>
        <label>Largeur</label>
        <input id="inputLargeurTravail" type="number" min="0.1" step="0.5" value="20">
    </div>

</div>

<div class="bloc">
</div>

<div id="guidage">

    <div id="ecart">
        ← 0,8 m
    </div>

    <div id="tracteur">
    <img id="imageTracteur" src="tracteur_vert.svg" alt="Tracteur">
</div>

<div id="angleRaccrochage"></div>

    <div id="ligneReference"></div>

</div>

<div id="lignes">

    

    <span id="ligneMoins">11</span>

    <span id="ligneActive">12</span>

    <span id="lignePlus">13</span>

</div>


<div id="distances">
    <span id="distanceMoins"></span>
    <span id="distanceActive"></span>
    <span id="distancePlus"></span>
</div>

<div id="infosBas">

    <span id="vitesse">
        7,1 km/h
    </span>

    <span id="sigma"></span>

    <span id="avancement"></span>

</div>

<div id="debugEcart"></div>

<div class="actions">

   <button id="btnPause">
        PAUSE / Semoir vide
    </button>

    <button id="btnReprendre">
        REPRENDRE
    </button> 

</div>
<div class="actions">

    <button id="btnMoins">Ligne -</button>

    <button id="btnPlus">Ligne +</button>

</div>


<div id="tableauGPSContainer">

    <table id="tableauGPS">

        <thead>
            <tr>
                <th>Pi</th>
                <th>Xi</th>
                <th>Yi</th>
                <th>km/h</th>
                <th>GPS</th>
                <th>CpDn</th>
                <th>d_Dn</th>
                <th>σ</th>
            </tr>
        </thead>

        <tbody id="corpsTableauGPS">
        </tbody>

    </table>

</div>

<div id="filtreGPSInfo"></div>

</div>


<script src="app-v2-final.js"></script>


</body>
</html>
